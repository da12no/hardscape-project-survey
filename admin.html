  <title>Hardscape Review Tracker</title>

    * { margin: 0; padding: 0; box-sizing: border-box; -webkit-tap-highlight-color: transparent; }

    }

    }
    .top-badge {
      font-size: 11px; font-weight: 700; letter-spacing: 0.1em;
      text-transform: uppercase; color: #C8943A;
      background: rgba(200,148,58,0.12);
      border: 1px solid rgba(200,148,58,0.3);
      border-radius: 8px; padding: 5px 12px;
    }

    /* ── QR CARD ── */
    .qr-card {
      width: 100%; max-width: 460px;
      background: rgba(255,255,255,0.04);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 20px; padding: 22px;
      display: flex; flex-direction: column; align-items: center;
      margin-bottom: 16px;
    }
    .qr-img-wrap {
      width: 210px; height: 210px; background: #fff;
      border-radius: 14px; display: flex; align-items: center;
      justify-content: center; margin-bottom: 14px; overflow: hidden;
    }
    .qr-img-wrap img { width: 192px; height: 192px; border-radius: 10px; }
    .qr-biz-name  { font-size: 14px; font-weight: 700; color: #EDE8E0; text-align: center; margin-bottom: 4px; }
    .qr-script-num { font-size: 12px; color: #5A5048; margin-bottom: 10px; }
    .script-preview {
      width: 100%; background: rgba(255,255,255,0.03);
      border-radius: 10px; padding: 11px 14px;
      font-size: 12px; color: #8A7A6E;
      line-height: 1.6; font-style: italic; text-align: left;
    }

    /* ── REMAINING ── */
    .remaining-bar {
      width: 100%; max-width: 460px;
      display: flex; align-items: center; justify-content: space-between;
      margin-bottom: 6px;
    }
    .remaining-label { font-size: 12px; color: #5A5048; }
    .remaining-count { font-size: 13px; font-weight: 700; color: #C8943A; }
    .remaining-sub { width: 100%; max-width: 460px; font-size: 11px; color: #3A3028; margin-bottom: 12px; }
    .progress-track {
      width: 100%; max-width: 460px; height: 4px;
      background: rgba(255,255,255,0.06); border-radius: 4px;
      margin-bottom: 22px; overflow: hidden;
    }
    .progress-fill {
      height: 100%;
      background: linear-gradient(to right, #9E6E28, #C8943A);
      border-radius: 4px; transition: width 0.3s;
    }

    /* ── NEXT BTN ── */

      width: 100%; max-width: 460px;
      background: linear-gradient(135deg, #9E6E28 0%, #C8943A 50%, #DBA84F 100%);
      border: none; border-radius: 16px; padding: 20px;
      font-size: 17px; font-weight: 900; color: #1A1816;
      letter-spacing: 0.04em; text-transform: uppercase;
      cursor: pointer; font-family: inherit;
      box-shadow: 0 6px 26px rgba(200,148,58,0.25);
      transition: opacity 0.15s, transform 0.1s; margin-bottom: 12px;
    }
    .next-btn:active { opacity: 0.88; transform: scale(0.975); }
    .next-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; box-shadow: none; }

      width: 100%; max-width: 460px;
      border-radius: 12px; padding: 13px 16px;
      font-size: 13px; text-align: center; line-height: 1.5; margin-top: 6px;

    .got-review-btn {
      width: 100%; max-width: 460px;
      background: linear-gradient(135deg, #1a6b3a 0%, #22a855 100%);
      border: none; border-radius: 16px; padding: 18px;
      font-size: 17px; font-weight: 800; color: #fff;

      transition: opacity 0.15s, transform 0.1s; margin-top: 12px;

      width: 100%; max-width: 460px;
      margin-top: 16px; margin-bottom: 32px;
      background: rgba(255,255,255,0.035);
      border: 1px solid rgba(255,255,255,0.07);
      border-radius: 16px; padding: 18px 20px;
    }
    .tally-header {
      font-size: 11px; letter-spacing: 0.14em; text-transform: uppercase;
      color: #5A5048; margin-bottom: 14px;
      display: flex; justify-content: space-between; align-items: center;

    .tally-empty { font-size: 13px; color: #3A3028; text-align: center; padding: 10px 0; }
    .tally-count-row {
      display: flex; justify-content: center; align-items: baseline; gap: 10px;

    }

    .tally-big-label { font-size: 14px; color: #5A5048; }
  </style>

// ─── HELPERS ───────────────────────────────────────────────────────────────
function shuffle(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function loadUsed() {
  try { const s = localStorage.getItem(USED_KEY); if (s) return new Set(JSON.parse(s)); } catch(e) {}
  return new Set();
}
function saveUsed(set) { localStorage.setItem(USED_KEY, JSON.stringify([...set])); }

function loadQueue() {
  try {
    const s = localStorage.getItem(QUEUE_KEY);
    if (s) { const q = JSON.parse(s); if (Array.isArray(q) && q.length > 0) return q; }
  } catch(e) {}
  return buildQueue();
}
function saveQueue(q) { localStorage.setItem(QUEUE_KEY, JSON.stringify(q)); }

function buildQueue() {
  const used  = loadUsed();
  const avail = [];
  for (let i = 0; i < TOTAL; i++) { if (!used.has(i)) avail.push(i); }
  return shuffle(avail);
}

// ─── RENDER ────────────────────────────────────────────────────────────────
let currentScriptIdx = null;

function renderQR() {
  if (currentScriptIdx === null) { renderExhausted(); return; }

  const url    = `${SITE_URL.replace(/\/$/, '')}/?s=${currentScriptIdx}`;
  const qrSrc  = `https://api.qrserver.com/v1/create-qr-code/?size=400x400&margin=10&data=${encodeURIComponent(url)}`;
  const used   = loadUsed();
  const usedCount   = used.size + 1;
  const remaining   = TOTAL - usedCount;

  document.getElementById('qr-img').src = qrSrc;
  document.getElementById('qr-script-num').textContent = `Script used: ${usedCount} of ${TOTAL}`;
  document.getElementById('script-preview').textContent = SCRIPTS[currentScriptIdx] || '';
  document.getElementById('remaining-count').textContent = remaining + ' left';
  document.getElementById('progress-fill').style.width = ((usedCount / TOTAL) * 100).toFixed(1) + '%';
  document.getElementById('next-btn').disabled = false;

  const pill = document.getElementById('status-pill');
  if (remaining <= 0) {
    renderExhausted();
  } else if (remaining <= LOW_WARNING) {
    pill.className = 'warning-pill low';
    pill.textContent = `Only ${remaining} scripts left. Time to add more.`;
  } else {
    pill.className = '';
    pill.textContent = '';
  }
}

function renderExhausted() {
  document.getElementById('next-btn').disabled = true;
  document.getElementById('remaining-count').textContent = '0 left';
  const pill = document.getElementById('status-pill');
  pill.className = 'warning-pill empty';
  pill.textContent = 'All 200 scripts have been used. Contact your admin to reload.';
}

function nextCustomer() {
  const used = loadUsed();
  if (currentScriptIdx !== null) {
    used.add(currentScriptIdx);
    saveUsed(used);
  }

  const used2 = loadUsed();
  const avail = [];
  for (let i = 0; i < TOTAL; i++) { if (!used2.has(i)) avail.push(i); }
  if (avail.length === 0) { currentScriptIdx = null; renderExhausted(); return; }

  let queue = loadQueue();
  queue = queue.filter(i => !used2.has(i));
  if (queue.length === 0) queue = shuffle(avail);
  currentScriptIdx = queue.pop();
  saveQueue(queue);
  renderQR();
  renderTally();
}

// ─── REVIEW TALLY ──────────────────────────────────────────────────────────
function loadReviews() {
  try { const s = localStorage.getItem(REVIEWS_KEY); if (s) return JSON.parse(s); } catch(e) {}
  return [];
}
function saveReviews(r) { localStorage.setItem(REVIEWS_KEY, JSON.stringify(r)); }
function todayStr() { return new Date().toLocaleDateString('en-CA'); }

function removeReview(timestamp) {
  saveReviews(loadReviews().filter(r => r.timestamp !== timestamp));
  renderTally();
}

function logReview() {
  const reviews = loadReviews();
  reviews.push({ timestamp: new Date().toISOString() });
  saveReviews(reviews);

  const btn = document.getElementById('got-review-btn');
  btn.textContent = '✓ Logged!';
  btn.style.opacity = '0.6';
  setTimeout(() => { btn.textContent = '✓ Got a Review'; btn.style.opacity = ''; }, 900);

  renderTally();
}

function renderTally() {
  const section = document.getElementById('tally-section');
  const today = todayStr();
  const todayReviews = loadReviews().filter(r => new Date(r.timestamp).toLocaleDateString('en-CA') === today);
  const total = todayReviews.length;

  let html = `<div class="tally-header"><span>Today's Reviews</span><span class="tally-total-badge">${total} today</span></div>`;

  if (total === 0) {
    html += `<div class="tally-empty">No reviews logged yet today.<br>Tap the button after each one.</div>`;
  } else {
    html += `<div class="tally-count-row"><span class="tally-big-num">${total}</span><span class="tally-big-label">review${total !== 1 ? 's' : ''} today</span></div>`;
  }

  const recent = [...todayReviews].reverse().slice(0, 8);
  if (recent.length > 0) {
    html += `<div class="tally-divider"></div><div class="tally-log-title">Recent</div>`;
    recent.forEach(r => {
      const t = new Date(r.timestamp);
      const timeStr = t.toLocaleTimeString('en-US', { hour: 'numeric', minute: '2-digit', hour12: true });
      html += `<div class="tally-log-entry"><span style="color:#8A7A6E;">Phoenix Hardscape Pros</span><span class="log-time">${timeStr}<button class="log-remove" onclick="removeReview('${r.timestamp}')" title="Remove">&#215;</button></span></div>`;
    });
  }

  section.innerHTML = html;
}

// ─── INIT ──────────────────────────────────────────────────────────────────
(function init() {
  let queue = loadQueue();
  if (queue.length === 0) {
    const used = loadUsed();
    const avail = [];
    for (let i = 0; i < TOTAL; i++) { if (!used.has(i)) avail.push(i); }
    if (avail.length === 0) { renderExhausted(); renderTally(); return; }
    queue = shuffle(avail);
  }
  currentScriptIdx = queue.pop();
  saveQueue(queue);
  renderQR();
  renderTally();
})();
</script>

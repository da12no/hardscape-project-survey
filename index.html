function init() {
  const params = new URLSearchParams(location.search);
  const idx = parseInt(params.get('s') || '0', 10);
  const script = SCRIPTS[Math.min(Math.max(idx, 0), SCRIPTS.length - 1)];
  document.getElementById('script-text').textContent = script;
}

function copyAndRedirect() {
  const text  = document.getElementById('script-text').textContent;
  const btn   = document.getElementById('copy-btn');
  const label = document.getElementById('copy-label');
  const icon  = document.getElementById('copy-icon');

  if (navigator.clipboard && window.isSecureContext) {
    navigator.clipboard.writeText(text)
      .then(() => showCopied(btn, label, icon))
      .catch(() => legacyCopy(text, btn, label, icon));
  } else {
    legacyCopy(text, btn, label, icon);
  }
}

function legacyCopy(text, btn, label, icon) {
  const ta = document.createElement('textarea');
  ta.value = text;
  ta.style.cssText = 'position:fixed;left:-9999px;top:-9999px;opacity:0';
  document.body.appendChild(ta);
  ta.focus(); ta.select();
  try { document.execCommand('copy'); } catch(e) {}
  document.body.removeChild(ta);
  showCopied(btn, label, icon);
}

function showCopied(btn, label, icon) {
  btn.classList.add('copied');
  icon.textContent = '✓';
  label.innerHTML = 'Copied!<br>Opening Google...';
  setTimeout(() => { window.location.href = GBP_URL; }, 1500);
}

init();
